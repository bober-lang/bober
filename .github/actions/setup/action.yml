# Of TPDE's submodules those it builds with, which its stamp hashes; the sysroot and the C libraries of bober.pkg, LLVM's
# an hour to build, the latest saved, without their sources and builds, with ccache's objects, the cache keyed by
# INPUTS, the hash of what they are built of: restored of the same, nothing is stale, and the toolchain, which only
# builds them, is not installed, unless tools; else the C toolchain, with ccache, checking the compiler by its version,
# as each run installs it anew, a nightly on Linux, kept small, as GitHub's caches of a repo are, then those whose stamp
# is stale rebuild, and on Linux the sysroot if missing. The workflow saves the cache anew if the key restored, in
# CACHE_KEY, is of other inputs.
name: setup
inputs:
  tools:
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      run: git -C vendor/tpde submodule update --init --depth 1 deps/fadec deps/disarm
    - shell: bash
      run: |
        h=$(git ls-tree -r HEAD bober.pkg src/backend/clang.cmake src/backend/llvm src/backend/tpde vendor/tpde vendor/musl \
          vendor/mimalloc | git hash-object --stdin)
        echo INPUTS=c-$RUNNER_OS-$RUNNER_ARCH-$h- >> $GITHUB_ENV
        printf '%s\n' CCACHE_DIR=$PWD/build/ccache "CCACHE_COMPILERCHECK=%compiler% -dumpversion" CCACHE_MAXSIZE=2G >> $GITHUB_ENV
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: |
          build/musl
          build/@bober
          build/ccache
          !build/@bober/*/*/src
          !build/@bober/*/*/src.tar
          !build/@bober/*/*/build
        key: ${{ env.INPUTS }}
        restore-keys: c-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: echo CACHE_KEY=${{ steps.cache.outputs.cache-matched-key }} >> $GITHUB_ENV
    - if: inputs.tools == 'true' || !startsWith(env.CACHE_KEY, env.INPUTS)
      shell: bash
      run: |
        if [ $RUNNER_OS = Linux ]; then
          c=$(lsb_release -cs)
          curl -fsS https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/$c/ llvm-toolchain-$c main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-24 lld-24 libclang-rt-24-dev ninja-build ccache
          export PATH=/usr/lib/llvm-24/bin:$PATH
          echo /usr/lib/llvm-24/bin >> $GITHUB_PATH
          make -C src/backend/llvm
        else
          brew install llvm lld ccache
          for p in llvm lld; do echo "$(brew --prefix $p)/bin" >> $GITHUB_PATH; done
        fi
