# Builds bober by the latest edge, the package dev last published (bootstrap.yml makes one anew), runs the tests and
# packages it; on dev, once the tests pass everywhere, publishes the packages as the new edge.
name: ci
on: push

jobs:
  bober:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    concurrency: { group: "${{ github.ref }}-${{ matrix.os }}", cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - run: |
          curl -fsS https://dl.bober-lang.dev/edge/bober-$RUNNER_OS-$RUNNER_ARCH.tar.gz | tar -xz -C $RUNNER_TEMP
          $RUNNER_TEMP/bober/bin/bober run -release src/bober.bob help > /dev/null
      - if: always()
        run: echo KEY=c-$RUNNER_OS-$RUNNER_ARCH-${{ hashFiles('build/@bober/*/*/stamp') }}- >> $GITHUB_ENV
      - if: always() && !startsWith(env.CACHE_KEY, env.KEY)
        uses: actions/cache/save@v6
        with:
          path: |
            build/musl
            build/@bober
            build/ccache
            !build/@bober/*/*/src
            !build/@bober/*/*/src.tar
            !build/@bober/*/*/build
          key: ${{ env.KEY }}${{ github.run_id }}
      - run: build/bober test
      - run: ./dist.sh
      - uses: actions/upload-artifact@v7
        with:
          name: bober-${{ runner.os }}-${{ runner.arch }}
          path: build/dist/bober.tar.gz

  publish:
    needs: bober
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/publish.yml
    secrets: inherit
