# Publishes the packages a run of ci.yml or bootstrap.yml built as the new edge, in the environment that alone has the
# secrets, running no code of the repo's: signs macOS's package by the Developer ID, hardened, by rcodesign, of its
# release checked by hash, letting the launcher still load the images bober links, signed ad hoc; has Apple notarize its
# executables, by their hashes, so that Gatekeeper lets a download of them run; and replaces the packages of the
# prerelease edge, then the line naming their build, version, which bober update compares, and moves the tag edge to
# their commit. Not cancelled by a newer run, which waits. Its callers grant it contents: write.
name: publish
on: workflow_call

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    concurrency: publish
    steps:
      - uses: actions/download-artifact@v8
      - env:
          CERT: ${{ secrets.MACOS_CERT }}
          PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          v=0.29.0 t=$RUNNER_TEMP
          curl -fsSL -o $t/rcodesign.tar.gz \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/$v/apple-codesign-$v-x86_64-unknown-linux-musl.tar.gz
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $t/rcodesign.tar.gz" | sha256sum -c
          tar -xzf $t/rcodesign.tar.gz -C $t --strip-components=1
          echo "$CERT" | base64 -d | openssl pkcs12 -legacy -passin env:PASSWORD -nodes -out $t/cert.pem
          tar -xzf bober-macOS-ARM64/bober.tar.gz
          sign() { $t/rcodesign sign --pem-file $t/cert.pem --code-signature-flags runtime "$@"; }
          sign bober/bin/bober
          echo '<plist><dict><key>com.apple.security.cs.disable-library-validation</key><true/></dict></plist>' > $t/e.plist
          sign --entitlements-xml-file $t/e.plist bober/lib/launch.c.exe
          echo "$KEY" > $t/key.p8
          $t/rcodesign encode-app-store-connect-api-key -o $t/key.json ${{ secrets.NOTARY_ISSUER }} \
            ${{ secrets.NOTARY_KEY_ID }} $t/key.p8
          zip -qr $t/bober.zip bober
          $t/rcodesign notary-submit --api-key-file $t/key.json --wait --max-wait-seconds 900 $t/bober.zip
          tar -czf bober-macOS-ARM64/bober.tar.gz bober
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for p in bober-*/; do cp $p/bober.tar.gz ${p%/}.tar.gz; done
          gh release upload edge --clobber bober-*.tar.gz
          tar -xzOf bober-Linux-X64/bober.tar.gz bober/lib/version > version
          gh release upload edge --clobber version
          gh api -X PATCH repos/$GH_REPO/git/refs/tags/edge -f sha=$GITHUB_SHA -F force=true > /dev/null
